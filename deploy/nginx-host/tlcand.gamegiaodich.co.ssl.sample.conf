# Mẫu khối HTTPS — ghép vào cùng file site hoặc include sau khi đã có chứng chỉ.
# Đường dẫn certbot mặc định; chỉnh nếu domain/path khác.
#
# Certbot (ví dụ webroot đã bật ở khối HTTP):
#   sudo certbot certonly --webroot -w /var/www/certbot -d tlcand.gamegiaodich.co
#
# Sau đó merge khối server bên dưới vào file site chính và (tuỳ chọn) thêm redirect HTTP→HTTPS
# trong khối listen 80: location / { return 301 https://$host$request_uri; } — trừ acme-challenge.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tlcand.gamegiaodich.co;

    ssl_certificate     /etc/letsencrypt/live/tlcand.gamegiaodich.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tlcand.gamegiaodich.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://image_wall_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
