# Site Nginx trên HOST — chạy chung cổng 80 / 443 với các site khác (mỗi site = một server_name).
#
# Cài đặt (Debian/Ubuntu):
#   sudo cp deploy/nginx-host/tlcand.gamegiaoduc.co.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/tlcand.gamegiaoduc.co.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Docker phải publish backend chỉ ra localhost (không mở 5000 ra internet):
#   trong docker-compose.yml dùng: "127.0.0.1:5000:80" (service nginx trong compose).
#
# HTTPS đồng bộ (certbot + render Nginx HTTP→HTTPS + 443):
#   sudo ./deploy/ssl/bootstrap-http-only.sh
#   sudo EMAIL=ban@domain.tld ./deploy/ssl/issue-sync.sh

upstream image_wall_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tlcand.gamegiaoduc.co;

    client_max_body_size 25m;

    # Let's Encrypt HTTP-01 (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        proxy_pass http://image_wall_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
