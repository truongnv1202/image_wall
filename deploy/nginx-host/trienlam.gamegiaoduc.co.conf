# Site Nginx trên HOST — trienlam.gamegiaoduc.co (tường ảnh triển lãm)
#
# Cài đặt (Debian/Ubuntu):
#   sudo cp deploy/nginx-host/trienlam.gamegiaoduc.co.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/trienlam.gamegiaoduc.co.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Docker: trong docker-compose.yml dùng "127.0.0.1:5000:80" khi Nginx host reverse-proxy.
#
# HTTPS:
#   sudo ./deploy/ssl/bootstrap-http-only.sh
#   sudo EMAIL=ban@domain.tld ./deploy/ssl/issue-sync.sh

upstream trienlam_gamegiaoduc_upstream {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name trienlam.gamegiaoduc.co;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        proxy_pass http://trienlam_gamegiaoduc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
