# Mẫu khối HTTPS — sau khi có cert Let’s Encrypt.
#   sudo certbot certonly --webroot -w /var/www/certbot -d trienlam.gamegiaoduc.co

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trienlam.gamegiaoduc.co;

    ssl_certificate     /etc/letsencrypt/live/trienlam.gamegiaoduc.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trienlam.gamegiaoduc.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://trienlam_gamegiaoduc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
